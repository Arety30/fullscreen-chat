<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        #sidebar { width: 250px; background: #f4f4f4; padding: 20px; }
        #main { flex: 1; display: flex; flex-direction: column; padding: 20px; }
        #chat-window { flex: 1; overflow-y: auto; border: 1px solid #ccc; margin-bottom: 10px; padding: 10px; }
        #input-area { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>Models</h3>
        <select id="model-select"></select>
    </div>
    <div id="main">
        <div id="chat-window"></div>
        <div id="input-area">
            <input type="text" id="user-input" style="flex:1" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="chat.js"></script>
</body>
</html>
